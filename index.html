
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Leadership Excellence Check</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #17253e;
      margin: 0;
      padding: 30px 16px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #13294b15;
    }

    .subtitle { color: #64748b; }

    h1 { margin-bottom: 10px; }

    .question {
      margin: 25px 0;
      padding-bottom: 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    .question label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .question p {
      color: #64748b;
      font-size: 14px;
    }

    input[type=range] { width: 100%; }

    button {
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #1e40af; }

    #result {
      display: none;
      background: #eff6ff;
      padding: 20px;
      margin-top: 25px;
      border-radius: 12px;
    }

    .score {
      font-size: 38px;
      font-weight: bold;
      color: #1d4ed8;
    }

    .note {
      font-size: 12px;
      color: #64748b;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Leadership Excellence Check</h1>
    <p class="subtitle">
      Bewerte deine Führungs- und Projektpraktiken
      auf einer Skala von 1 bis 5.
    </p>

    <div id="questions"></div>

    <button onclick="calculate()">
      Mein Ergebnis anzeigen
    </button>

    <section id="result" aria-live="polite">
      <h2>Dein Ergebnis</h2>
      <div id="score" class="score"></div>
      <p id="message"></p>
      <p id="recommendation"></p>
    </section>

    <p class="note">
      Demo-Selbstcheck. Keine wissenschaftlich
      validierte Diagnostik.
    </p>
  </main>

  <script>
    const questions = [
      {
        name: "Klare Ziele",
        text: "Mein Team kennt unsere wichtigsten Ziele."
      },
      {
        name: "Kommunikation",
        text: "Ich kommuniziere offen und regelmäßig."
      },
      {
        name: "Verantwortung",
        text: "Rollen und Zuständigkeiten sind klar."
      },
      {
        name: "Feedback",
        text: "Ich gebe regelmäßig hilfreiches Feedback."
      },
      {
        name: "Projektsteuerung",
        text: "Wir erkennen Risiken und Probleme frühzeitig."
      }
    ];

    const container =
      document.getElementById("questions");

    questions.forEach((question, index) => {
      const div = document.createElement("div");
      div.className = "question";

      const label = document.createElement("label");
      label.htmlFor = "q" + index;
      label.textContent = question.name;

      const description = document.createElement("p");
      description.textContent = question.text;

      const slider = document.createElement("input");
      slider.type = "range";
      slider.min = "1";
      slider.max = "5";
      slider.value = "3";
      slider.id = "q" + index;

      const value = document.createElement("span");
      value.textContent = "3 / 5";

      slider.addEventListener("input", () => {
        value.textContent = slider.value + " / 5";
        document.getElementById("result")
          .style.display = "none";
      });

      div.append(label, description, slider, value);
      container.appendChild(div);
    });

    function calculate() {
      let total = 0;
      let lowest = 6;
      let weakest = "";

      questions.forEach((question, index) => {
        const value = Number(
          document.getElementById("q" + index).value
        );

        total += value;

        if (value < lowest) {
          lowest = value;
          weakest = question.name;
        }
      });

      const percentage = Math.round(total / 25 * 100);

      let message = "";

      if (percentage >= 80) {
        message = "Starke Ausgangsbasis!";
      } else if (percentage >= 56) {
        message = "Gute Entwicklungsmöglichkeiten.";
      } else {
        message = "Deutliches Verbesserungspotenzial.";
      }

      document.getElementById("score")
        .textContent = percentage + " %";

      document.getElementById("message")
        .textContent = message;

      document.getElementById("recommendation")
        .textContent =
          "Dein größter Entwicklungsbereich: " +
          weakest +
          ". Definiere hier eine konkrete Maßnahme.";

      document.getElementById("result")
        .style.display = "block";
    }
  </script>
</body>
</html>
